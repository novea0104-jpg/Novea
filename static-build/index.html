<!DOCTYPE html>
<html>
  <head>
    <title>Static Expo Hosting</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 500px;
        margin: 50px auto;
        padding: 20px;
        text-align: center;
      }
      .loading {
        display: none;
        font-size: 18px;
        color: #666;
        margin: 60px 0;
      }
      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #333;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .content {
        display: block;
      }
      .qr-code {
        width: 250px;
        height: 250px;
        margin: 30px auto;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
      }
      .qr-code img {
        width: 100%;
        height: 100%;
      }
      .platform-links {
        margin: 30px 0;
      }
      .platform-link {
        display: block;
        padding: 12px 24px;
        margin: 12px auto;
        max-width: 300px;
        font-size: 16px;
        border: 1px solid #000;
        border-radius: 6px;
        text-decoration: none;
        color: #000;
        background: white;
      }
      .platform-link:hover {
        background: #f5f5f5;
      }
      .download-links {
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid #ddd;
      }
      .install-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 12px;
        margin: 0 6px;
        font-size: 14px;
        border: 1px solid #ddd;
        border-radius: 4px;
        text-decoration: none;
        color: #333;
        background: white;
      }
      .install-button:hover {
        background: #f5f5f5;
      }
      .store-icon {
        width: 16px;
        height: 16px;
        margin-right: 6px;
      }
      .install-text {
        color: #999;
        font-size: 14px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="loading" id="loading" style="display: none;">
      <div class="spinner"></div>
      <div>Loading...</div>
    </div>

    <div class="content" id="content">
      <div class="qr-code">
        <img
          src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://noveaindonesia.com"
          alt="QR Code"
          title="https://noveaindonesia.com"
        />
      </div>

      <div class="platform-links">
        <a
          href="https://play.google.com/store/apps/details?id=com.novea.app"
          class="platform-link"
          target="_blank"
          >📱 Download Novea App</a
        >
      </div>
    </div>

    <script>
      // Production: App Links akan bekerja secara native
      // Tidak perlu redirect ke Expo Go karena aplikasi sudah di-build untuk production
      // App Links akan otomatis membuka aplikasi untuk URL yang sesuai dengan intentFilters
    </script>
  </body>
</html>
